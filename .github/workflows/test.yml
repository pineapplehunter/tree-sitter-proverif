name: Test grammar
on:
  push:
  pull_request:

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run generate
      - run: npm test
      - name: Check generated parser is up to date
        run: git diff --exit-code -- src
